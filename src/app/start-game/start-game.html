<section class="content-screen flex flex-col items-center justify-center z-10 backdrop-blur-lg bg-black/80 p-8 md:p-12 rounded-3xl border border-cyan-500/40 shadow-[0_0_50px_rgba(0,255,255,0.1)] w-[95%] max-w-4xl animate-fade-in">
  <h2 class="text-3xl md:text-4xl font-bold text-cyan-400 mb-8 uppercase tracking-widest text-center">
    Selecione seu Perfil de Auditoria
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full mb-8">
    @for (char of characters; track char.id) {
      <div
        (click)="selectChar(char.id)"
        class="char-card p-6 rounded-xl border-2 cursor-pointer transition-all duration-300 flex flex-col items-center gap-4 group"
        [class]="selectedChar() === char.id ? 'border-cyan-400 bg-cyan-900/30 shadow-[0_0_20px_rgba(0,255,255,0.3)] scale-105' : 'border-gray-800 bg-gray-900/50 hover:border-gray-500'">

        <div class="w-24 h-24 rounded-full bg-gray-800 flex items-center justify-center border border-gray-700 overflow-hidden relative">
            <div class="absolute inset-0 bg-gradient-to-tr" [class]="char.color"></div>
        </div>

        <div class="text-center z-10">
          <h3 class="text-xl font-bold text-white mb-1 uppercase tracking-wide">{{ char.name }}</h3>
          <p class="text-xs text-gray-400">{{ char.desc }}</p>
        </div>
      </div>
    }
  </div>

  <div class="flex gap-4 w-full justify-center mt-4">
    <button (click)="onBack()" [disabled]="isConnecting()" class="cyber-btn-secondary m-0 disabled:opacity-50 disabled:cursor-not-allowed">Voltar</button>
    <button [disabled]="!selectedChar() || isConnecting()"
            (click)="startGame()"
            class="cyber-btn m-0 max-w-[250px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:transform-none disabled:hover:shadow-none disabled:border-gray-700 flex justify-center items-center">

      @if (isConnecting()) {
        <span class="inline-block w-5 h-5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span>
        <span class="btn-text ml-3 text-cyan-400">Verificando...</span>
      } @else {
        <span class="btn-text">Iniciar Sincronia</span>
      }
    </button>
  </div>

  @if (connectionSuccess()) {
    <div class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/95 rounded-3xl animate-fade-in border border-cyan-500 shadow-[inset_0_0_100px_rgba(0,255,255,0.15)] overflow-hidden">
      <div class="bg-grid absolute inset-0 z-0 opacity-30"></div>

      <div class="z-10 w-24 h-24 mb-8 relative flex items-center justify-center">
        <div class="absolute inset-0 border-4 border-cyan-900 border-t-cyan-400 rounded-full animate-spin"></div>
        <div class="absolute inset-2 border-4 border-cyan-900 border-b-cyan-400 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
      </div>
      <h2 class="z-10 text-2xl md:text-4xl font-bold text-cyan-400 tracking-[0.4em] uppercase drop-shadow-[0_0_10px_rgba(0,255,255,0.8)]">Acesso Concedido</h2>
      <p class="z-10 text-cyan-600 mt-4 font-mono text-sm uppercase tracking-widest animate-pulse">Carregando termos da LGPD...</p>
    </div>
  }
</section>
