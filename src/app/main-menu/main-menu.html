<main class="menu-wrapper flex flex-col items-center z-10 p-12 rounded-3xl backdrop-blur-md bg-black/40 border border-white/5 shadow-2xl transition-all duration-500 animate-fade-in">
      <h1 class="game-title text-5xl md:text-7xl font-black mb-4 tracking-[0.2em] text-center uppercase text-white drop-shadow-lg">
        Cyber<span class="text-cyan-400">LGPD</span>
      </h1>
      <p class="text-cyan-600 font-mono text-sm uppercase tracking-widest mb-12">Compliance & Data Protection</p>

      <nav class="menu-options flex flex-col gap-6 w-full max-w-[300px]">
        <button (click)="onNavigate('start')" class="cyber-btn group">
          <span class="btn-text">Iniciar Jogo</span>
        </button>

        <button (click)="onNavigate('credits')" class="cyber-btn group">
          <span class="btn-text">Créditos</span>
        </button>

        <button (click)="toggleExitModal(true)" class="cyber-btn group !border-red-900/50 hover:!border-red-500 hover:!bg-red-500/10 hover:!shadow-[0_0_15px_rgba(255,0,0,0.4)]">
          <span class="btn-text text-red-400">Sair do Sistema</span>
        </button>
      </nav>

      @if (showExitModal()) {
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm animate-fade-in">
          <div class="bg-gray-950 border border-red-500/50 p-8 rounded-2xl max-w-md w-[90%] shadow-[0_0_40px_rgba(255,0,0,0.15)] text-center">
            <div class="text-red-500 mb-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            </div>
            <h3 class="text-2xl font-bold text-red-500 mb-2 tracking-widest uppercase">Aviso Crítico</h3>
            <p class="text-gray-400 mb-8 font-mono text-sm">Tem certeza que deseja desconectar o terminal de conformidade?</p>

            <div class="flex gap-4 justify-center">
              <button (click)="toggleExitModal(false)" class="cyber-btn-secondary !mt-0 w-full hover:!border-gray-400 hover:!text-white hover:!bg-transparent hover:!shadow-none">Cancelar</button>
              <button (click)="confirmExit()" class="cyber-btn !bg-red-900/20 hover:!bg-red-600/40 !border-red-500/50 hover:!border-red-400 w-full !p-3">
                <span class="btn-text text-red-400 group-hover:text-red-100">Desconectar</span>
              </button>
            </div>
          </div>
        </div>
      }
    </main>
