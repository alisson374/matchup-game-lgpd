<div class="game-container flex flex-col items-center justify-center min-h-screen w-full relative overflow-hidden bg-gray-950 font-sans select-none">

  <div class="bg-grid absolute inset-0 z-0"></div>
  <div class="vignette absolute inset-0 z-0 pointer-events-none"></div>

  @switch (currentScreen()) {
    @case ('home') {
      <app-main-menu (navigate)="navigateTo($event)" (logout)="navigateTo('logout')"></app-main-menu>
    }
    @case ('start') {
      <app-start-game (back)="navigateTo('home')" (startMatch)="navigateTo('game')"></app-start-game>
    }
    @case ('credits') {
      <app-credits (back)="navigateTo('home')"></app-credits>
    }
    @case ('game') {
      <app-match-up-game (back)="navigateTo('home')"></app-match-up-game>
    }
    @case ('logout') {
      <div class="z-10 flex flex-col items-center justify-center p-12 bg-black/80 backdrop-blur-md rounded-3xl border border-red-500/30 animate-fade-in text-center">
          <span class="text-red-500 font-mono text-3xl md:text-5xl tracking-[0.2em] uppercase font-bold mb-6 drop-shadow-[0_0_15px_rgba(255,0,0,0.5)]">[ SESSÃO ENCERRADA ]</span>
          <button (click)="navigateTo('home')" class="cyber-btn-secondary !mt-4 hover:!text-cyan-400 hover:!border-cyan-400">Reconectar ao Terminal</button>
      </div>
    }
  }

</div>
