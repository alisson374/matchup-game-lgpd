<section class="content-screen flex flex-col items-center z-10 backdrop-blur-lg bg-black/80 p-10 rounded-3xl border border-cyan-500/40 shadow-[0_0_50px_rgba(0,255,255,0.1)] w-[90%] max-w-xl animate-fade-in">
  <h2 class="text-3xl font-bold text-cyan-400 mb-6 uppercase tracking-widest text-center">
    Créditos
  </h2>

  <div class="w-full h-[250px] overflow-hidden relative rounded-lg border border-gray-800 bg-gray-950/50 p-4">

    <div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-gray-950 to-transparent z-10 pointer-events-none"></div>

    <div class="credits-scroll text-center text-gray-400 flex flex-col gap-8 absolute w-full left-0 font-mono text-sm uppercase tracking-wider">
      <div>
        <h3 class="text-cyan-500 font-bold mb-2"> Tema do Trabalho </h3>
        <p>Diretrizes da LGPD (Lei 13.709/18)</p>
      </div>
      <div>
        <h3 class="text-cyan-500 font-bold mb-2"> Integrantes </h3>
        <p> Alisson dos Santos </p>
        <p> Felipe de Sá Correa </p>
        <p> Gabriel Cunico </p>
        <p> Guilheme Ribeiro Gularte </p>
        <p> Pedro Augusto Santana </p>
      </div>
    </div>
  </div>

  <button (click)="onBack()" class="cyber-btn-secondary"> Sair dos Créditos </button>
</section>
